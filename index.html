<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D0D" />
    <title>Vibe Engineering — сайты, боты и веб-приложения на заказ, Москва</title>
    <meta
      name="description"
      content="Инженерное бюро в Москве: считаем нагрузку до старта. Сайты, Telegram-боты, веб-приложения и AI-интеграции. Первый рабочий результат — через 48 часов, смета с фиксированной стоимостью — за 2 часа."
    />
    <link rel="canonical" href="https://vibeengineering.ru/" />

    <!-- Иконки: SVG — исходник, растры собираются в prebuild.
         favicon.ico нужен клиентам без поддержки SVG-иконки. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vibeengineering.ru/" />
    <meta property="og:site_name" content="Vibe Engineering" />
    <meta property="og:locale" content="ru_RU" />
    <meta
      property="og:title"
      content="Vibe Engineering — сайты, боты и веб-приложения на заказ, Москва"
    />
    <meta
      property="og:description"
      content="Мы строили мосты, порталы и ивенты. Теперь строим ваш digital: считаем нагрузку до старта, первый рабочий результат — через 48 часов."
    />
    <!-- og.png собирается скриптом scripts/generate-og.mjs (npm run og), в git не коммитится -->
    <meta property="og:image" content="https://vibeengineering.ru/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vibe Engineering — сайты, боты и веб-приложения: первый рабочий результат через 48 часов"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Vibe Engineering — сайты, боты и веб-приложения на заказ, Москва"
    />
    <meta
      name="twitter:description"
      content="Мы строили мосты, порталы и ивенты. Теперь строим ваш digital: считаем нагрузку до старта, первый рабочий результат — через 48 часов."
    />
    <meta name="twitter:image" content="https://vibeengineering.ru/og.png" />

    <!-- Шрифты со своего домена: сторонних CDN и preconnect'ов больше нет.
         @font-face и разбор — в src/index.css. Прогреваем три файла, которые
         нужны первому экрану: заголовок, текст и подписи, все кириллические. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/mplus-rounded-1c-700-cyrillic.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-sans-400-cyrillic.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-400-cyrillic.woff2"
      crossorigin
    />

    <!-- JSON-LD: один узел с массивом @type (Organization и LocalBusiness —
         это один субъект). Правила для sameAs — docs/BACKLOG.md §9. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "LocalBusiness"],
            "@id": "https://vibeengineering.ru/#organization",
            "name": "Vibe Engineering",
            "legalName": "ООО «ВАЙБ ИНЖИНИРИНГ»",
            "url": "https://vibeengineering.ru/",
            "logo": "https://vibeengineering.ru/apple-touch-icon.png",
            "image": "https://vibeengineering.ru/og.png",
            "email": "hq@vibeengineering.ru",
            "description": "Инженерное бюро: сайты, Telegram-боты, веб-приложения и AI-интеграции. Первый рабочий результат — через 48 часов.",
            "sameAs": ["https://t.me/vovaegorovv"],
            "founder": [
              {
                "@type": "Person",
                "name": "Владимир Егоров",
                "jobTitle": "Креативный продюсер"
              },
              {
                "@type": "Person",
                "name": "Роман Петров",
                "jobTitle": "Технический директор"
              }
            ],
            "priceRange": "$$",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Москва",
              "addressCountry": "RU"
            },
            "areaServed": "RU",
            "knowsLanguage": ["ru", "en"],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Услуги",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": { "@type": "Service", "name": "Разработка сайтов" }
                },
                {
                  "@type": "Offer",
                  "itemOffered": { "@type": "Service", "name": "Telegram-боты" }
                },
                {
                  "@type": "Offer",
                  "itemOffered": { "@type": "Service", "name": "Веб-приложения" }
                },
                {
                  "@type": "Offer",
                  "itemOffered": { "@type": "Service", "name": "AI-интеграции" }
                }
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://vibeengineering.ru/#website",
            "url": "https://vibeengineering.ru/",
            "name": "Vibe Engineering",
            "inLanguage": "ru-RU",
            "publisher": { "@id": "https://vibeengineering.ru/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
